[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-decisioning"
version = "0.1.0"
description = "Calibrated, cost-sensitive, auditable credit risk decisioning system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "lightgbm>=4.1",
    # Upper-bounded deliberately: SHAP changed the return shape of
    # TreeExplainer.shap_values for binary classifiers between minor versions
    # (one matrix per class vs one matrix). src.explain handles both, but an
    # unbounded range invites a third shape nobody has tested against.
    "shap>=0.44,<0.50",
    "matplotlib>=3.8",
    "imbalanced-learn>=0.12",
    "statsmodels>=0.14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "joblib>=1.3",
    "requests>=2.31",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs",
    "types-requests",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "D"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "E501",  # line length handled by formatter
    "N803",  # allow X / y sklearn-style argument names
    "N806",  # allow X_train style locals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ARG001"]
"scripts/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = []
exclude = ["build/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
